<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto Corporativo | VAP ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'tech-black': '#0a0a0c',
                        'tech-gray': '#1f2125',
                        'tech-green': '#10b981',
                    }
                }
            }
        }
    </script>
    <style>
        .animated-bg {
            background: linear-gradient(-45deg, #0a0a0c, #1f2125, #0a0a0c, #051d14);
            background-size: 400% 400%;
            animation: gradientPulse 15s ease infinite;
        }
        @keyframes gradientPulse {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .light .animated-bg { background: linear-gradient(-45deg, #f8fafc, #e2e8f0, #f1f5f9, #dcfce7); }
        .light body { background-color: #f8fafc; color: #1e293b; }
        .light nav { background-color: rgba(255, 255, 255, 0.9); border-color: #e2e8f0; }
        .light .text-white { color: #0f172a; }
        .light .bg-tech-gray { background-color: #f1f5f9; }
        .light .bg-tech-black { background-color: #ffffff; }
        .light input, .light select, .light textarea { background-color: #ffffff; border-color: #cbd5e1; color: #1e293b; }
        body { transition: background-color 0.3s, color 0.3s; }
    </style>
</head>
<body class="bg-tech-black text-slate-200 font-sans antialiased overflow-x-hidden">

    <nav class="bg-tech-gray/90 backdrop-blur-sm sticky top-0 z-50 border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="index.html" class="text-2xl font-bold text-white">VAP<span class="text-tech-green"> ERP</span></a>
                <div class="flex items-center space-x-6">
                    <a href="index.html" data-key="nav-back" class="text-slate-300 hover:text-tech-green transition-colors">Volver al Inicio</a>
                    <button id="themeBtn" class="text-slate-300 hover:text-tech-green transition-colors">
                        <i id="themeIcon" class="fa-solid fa-sun"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <section class="py-16 animated-bg min-h-screen relative flex items-center">
        <div class="max-w-4xl mx-auto px-4 relative z-10 w-full">
            <div class="text-center mb-10" data-aos="fade-up">
                <h1 id="cont-title" class="text-4xl md:text-5xl font-extrabold text-white mb-4">Evaluación de <span class="text-tech-green">Necesidades</span></h1>
                <p id="cont-desc" class="text-lg text-slate-400">Complete el formulario para recibir una propuesta personalizada.</p>
            </div>

            <div class="bg-tech-gray p-8 md:p-12 rounded-3xl border border-white/10 shadow-2xl" data-aos="fade-up" data-aos-delay="100">
                <form class="space-y-8">
                    <div>
                        <h3 class="text-tech-green font-bold mb-6 flex items-center"><i class="fa-solid fa-user mr-2"></i> Información Personal</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium mb-2 text-slate-400" data-key="f-name">Nombre</label>
                                <input type="text" required class="w-full bg-tech-black border border-white/10 rounded-xl px-4 py-3 focus:border-tech-green outline-none transition-all text-white">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2 text-slate-400" data-key="f-lastname">Apellido</label>
                                <input type="text" required class="w-full bg-tech-black border border-white/10 rounded-xl px-4 py-3 focus:border-tech-green outline-none transition-all text-white">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2 text-slate-400" data-key="f-email">Correo Corporativo</label>
                                <input type="email" required class="w-full bg-tech-black border border-white/10 rounded-xl px-4 py-3 focus:border-tech-green outline-none transition-all text-white">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2 text-slate-400" data-key="f-phone">Número de Teléfono</label>
                                <input type="tel" required class="w-full bg-tech-black border border-white/10 rounded-xl px-4 py-3 focus:border-tech-green outline-none transition-all text-white">
                            </div>
                        </div>
                    </div>

                    <div class="pt-6 border-t border-white/5">
                        <h3 class="text-tech-green font-bold mb-6 flex items-center"><i class="fa-solid fa-building mr-2"></i> Detalles de la Empresa</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium mb-2 text-slate-400" data-key="f-type">Tipo de Empresa</label>
                                <select class="w-full bg-tech-black border border-white/10 rounded-xl px-4 py-3 focus:border-tech-green outline-none transition-all text-white appearance-none">
                                    <option value="pyme">Pequeña / Mediana Empresa (PYME)</option>
                                    <option value="corporativo">Corporativo / Gran Empresa</option>
                                    <option value="startup">Startup</option>
                                    <option value="publico">Sector Público</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2 text-slate-400" data-key="f-sector">Rubro / Sector</label>
                                <select class="w-full bg-tech-black border border-white/10 rounded-xl px-4 py-3 focus:border-tech-green outline-none transition-all text-white appearance-none">
                                    <option value="retail">Retail / Comercio</option>
                                    <option value="manufactura">Manufactura</option>
                                    <option value="servicios">Servicios Profesionales</option>
                                    <option value="tecnologia">Tecnología</option>
                                    <option value="logistica">Logística y Transporte</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="pt-6 border-t border-white/5">
                        <h3 class="text-tech-green font-bold mb-6 flex items-center"><i class="fa-solid fa-message mr-2"></i> Su Consulta</h3>
                        <div>
                            <label class="block text-sm font-medium mb-2 text-slate-400" data-key="f-msg">Describa sus necesidades actuales</label>
                            <textarea rows="4" required class="w-full bg-tech-black border border-white/10 rounded-xl px-4 py-3 focus:border-tech-green outline-none transition-all text-white" placeholder="Ej: Necesito integrar facturación electrónica con control de almacenes..."></textarea>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-tech-green text-tech-black font-bold py-4 rounded-xl hover:bg-white transition-all transform hover:scale-[1.02] shadow-xl shadow-tech-green/20" data-key="f-btn">
                        Enviar Solicitud de Evaluación
                    </button>
                </form>
            </div>
        </div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
        const themeBtn = document.getElementById('themeBtn');
        const themeIcon = document.getElementById('themeIcon');
        themeBtn.addEventListener('click', () => {
            const isLight = document.documentElement.classList.toggle('light');
            themeIcon.className = isLight ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        });
    </script>
</body>
</html>
